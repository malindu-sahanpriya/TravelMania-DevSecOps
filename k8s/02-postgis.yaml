apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: travelmania
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelmania-db
  namespace: travelmania
  labels:
    app: travelmania-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travelmania-db
  template:
    metadata:
      labels:
        app: travelmania-db
        tier: database
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgis
          image: postgis/postgis:16-3.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "travelmania"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: travelmania-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travelmania-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: tmp-dir
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "travelmania"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-run
          emptyDir: {}
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: travelmania-db
  namespace: travelmania
spec:
  type: ClusterIP
  selector:
    app: travelmania-db
  ports:
    - port: 5432
      targetPort: 5432